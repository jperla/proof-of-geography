name: Publish Zero-SSH Anchor OCI Image (Pinned Digest)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "infra/images/Dockerfile.anchor"
      - ".github/workflows/publish-anchor-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-push-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build real pog-cli verifier for release-gate self-tests
        run: cargo build --release --bin pog-cli

      - name: Verify measured image recipe hygiene (real-verifier self-tests + static lint only)
        run: |
          python3 scripts/release_gate.py --self-test
          python3 scripts/release_gate.py --lint

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/amd64 FROM scratch zero-SSH image to GHCR
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/images/Dockerfile.anchor
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/${{ github.repository }}/pog-anchor:nossh-${{ github.sha }}
            ghcr.io/${{ github.repository }}/pog-anchor:canary-nossh

      - name: Verify remote pinned digest, linux/amd64 architecture, reproducible binary SHA-256 & zero-shell/zero-SSH rootfs
        env:
          IMAGE_REPO: ghcr.io/${{ github.repository }}/pog-anchor
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          REVIEWED_LOCAL_SHA256: 774fb046526e78c304c648353ae93fd541bc08fa6a4371e0c1fa0e856496f477
        run: |
          set -euo pipefail
          PINNED="${IMAGE_REPO}@${IMAGE_DIGEST}"
          echo "Pinned OCI reference: ${PINNED}"

          # 1. Verify remote manifest resolves to linux/amd64
          docker buildx imagetools inspect "${PINNED}"
          docker pull --platform linux/amd64 "${PINNED}"
          ARCH=$(docker image inspect "${PINNED}" --format '{{.Os}}/{{.Architecture}}')
          echo "Verified platform: ${ARCH}"
          test "${ARCH}" = "linux/amd64"

          # 2. Export pulled container rootfs and verify ZERO sshd / shell / package manager
          CID=$(docker create --platform linux/amd64 "${PINNED}")
          trap 'docker rm "${CID}" >/dev/null 2>&1 || true' EXIT
          FILES=$(docker export "${CID}" | tar -t | sort)
          echo "--- Pulled image filesystem ---"
          echo "${FILES}"

          if echo "${FILES}" | grep -E '(^|/)(sshd|ssh|sh|bash|dash|ash|busybox|apt|apt-get|apk|dnf|yum|curl|wget|python3?|sudo|su|google_guest_agent|cloud-init)$'; then
            echo "ERROR: Forbidden shell/SSH/admin binary found in zero-SSH image!" >&2
            exit 1
          fi

          echo "${FILES}" | grep -qx 'usr/local/bin/pog-anchor'
          echo "${FILES}" | grep -qx 'etc/pog/SHA256SUMS'
          echo "${FILES}" | grep -qx 'etc/ssl/certs/ca-certificates.crt'

          # 3. Verify static musl pog-anchor binary SHA-256 matches embedded SHA256SUMS AND reviewed local SHA-256
          TMPD=$(mktemp -d)
          docker cp "${CID}:/usr/local/bin/pog-anchor" "${TMPD}/pog-anchor"
          docker cp "${CID}:/etc/pog/SHA256SUMS" "${TMPD}/SHA256SUMS"
          file "${TMPD}/pog-anchor" | grep -E 'ELF 64-bit.*x86-64.*static(-pie|ally) linked'
          (cd "${TMPD}" && sha256sum -c SHA256SUMS)
          ACTUAL_SHA256=$(sha256sum "${TMPD}/pog-anchor" | awk '{print $1}')
          echo "VERIFIED_PINNED_REF=${PINNED}"
          echo "VERIFIED_BINARY_SHA256=${ACTUAL_SHA256}"
          echo "REVIEWED_LOCAL_SHA256=${REVIEWED_LOCAL_SHA256}"
          test "${ACTUAL_SHA256}" = "${REVIEWED_LOCAL_SHA256}"

          # 4. Verify anonymous unauthenticated manifest GET by digest succeeds (confirms public pullability)
          python3 - "${{ github.repository }}/pog-anchor" "${IMAGE_DIGEST}" <<'PY'
          import json, sys, urllib.request
          repo, digest = sys.argv[1].lower(), sys.argv[2]
          with urllib.request.urlopen(f"https://ghcr.io/token?service=ghcr.io&scope=repository:{repo}:pull", timeout=15) as r:
              tok = json.loads(r.read().decode())["token"]
          req = urllib.request.Request(
              f"https://ghcr.io/v2/{repo}/manifests/{digest}",
              headers={
                  "Authorization": f"Bearer {tok}",
                  "Accept": "application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json",
              },
          )
          with urllib.request.urlopen(req, timeout=15) as r:
              assert r.status == 200, f"expected 200, got {r.status}"
              assert r.headers.get("Docker-Content-Digest") == digest
              print("ANONYMOUS_MANIFEST_GET_OK", r.status, digest)
          PY
