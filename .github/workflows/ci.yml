name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust-and-sdks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Rust workspace unit & live UDP integration tests
        run: cargo test --workspace
      - name: Build release pog-cli verifier
        run: cargo build --release --bin pog-cli
      - name: Run Clippy (strict)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Red-Team & Physics Simulation Suite
        run: cargo run --release --bin pog-cli -- simulate
      - name: Run Performance & Capacity Benchmark
        run: cargo run --release --bin pog-cli -- bench --verify-iters 1000
      - name: Regenerate cross-language SDK fixture
        run: cargo run --release --bin pog-cli -- export-sdk-fixture
      - name: Test Web Geometry, 7-Case Cap Fill & Constellation Isolation
        run: node --test web/test_geo.mjs
      - name: Test Release Gate Real Verifier Self-Tests & Static Lint (Lint Only — Not Promotion Auth)
        run: |
          python3 scripts/release_gate.py --self-test
          python3 scripts/release_gate.py --lint
          python3 scripts/verify_honolulu_addition.py --self-test
      - name: Test TypeScript SDK (zero dependencies)
        run: cd sdks/typescript && node --experimental-strip-types --test ./test.ts
      - name: Test Go SDK (zero dependencies)
        run: cd sdks/go && go test -v ./...
      - name: Test Python SDK (zero dependencies)
        run: cd sdks/python && PYTHONPATH=. python3 -m unittest discover -v tests
