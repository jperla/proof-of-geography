name: Release Linux Static Binaries & Fail-Closed Production Promotion

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v0.2.0)"
        required: true
        default: "v0.2.0"
      promote_production:
        description: "Run fail-closed production constellation promotion (requires real HW TEE attestation, measured manifest & separate coordinate audit)"
        type: boolean
        required: false
        default: false
      measured_manifest:
        description: "Path to measured software manifest JSON for promotion"
        required: false
        default: "config/production_measured_manifest.json"
      coordinate_audit:
        description: "Path to separately audited physical coordinates JSON for promotion"
        required: false
        default: "config/production_coordinate_audit.json"

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install musl-tools for 100% static Linux x86_64 binaries (Rocky 9 / RHEL / Alpine / Debian compatible)
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests, web geometry tests & static release-gate lint (lint only)
        run: |
          cargo test --workspace
          cargo build --release --bin pog-cli
          node --test web/test_geo.mjs
          python3 scripts/release_gate.py --self-test
          python3 scripts/release_gate.py --lint
      - name: Build static musl release binaries for Confidential VMs & Nitro Enclaves
        run: cargo build --release --target x86_64-unknown-linux-musl --bin pog-anchor --bin pog-prover --bin pog-cli
      - name: Package release tarball and SHA-256 checksum
        run: |
          mkdir -p dist/x86_64 release-assets
          cp target/x86_64-unknown-linux-musl/release/pog-anchor target/x86_64-unknown-linux-musl/release/pog-prover target/x86_64-unknown-linux-musl/release/pog-cli dist/x86_64/
          file dist/x86_64/pog-anchor
          tar -czf release-assets/pog-linux-x86_64.tar.gz -C dist/x86_64 pog-anchor pog-prover pog-cli
          (cd release-assets && sha256sum pog-linux-x86_64.tar.gz > pog-linux-x86_64.tar.gz.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: release-assets/

  build-linux-aarch64-nitro:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install musl-tools for 100% static Linux aarch64 binaries (Amazon Linux 2023 / Rocky 9 Graviton)
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build static aarch64 musl release binaries (host relay, prover, CLI)
        run: cargo build --release --target aarch64-unknown-linux-musl --bin pog-anchor --bin pog-prover --bin pog-cli
      - name: Package aarch64 release tarball and SHA-256 checksum
        run: |
          mkdir -p dist/aarch64 release-assets
          cp target/aarch64-unknown-linux-musl/release/pog-anchor target/aarch64-unknown-linux-musl/release/pog-prover target/aarch64-unknown-linux-musl/release/pog-cli dist/aarch64/
          file dist/aarch64/pog-anchor
          tar -czf release-assets/pog-linux-aarch64.tar.gz -C dist/aarch64 pog-anchor pog-prover pog-cli
          (cd release-assets && sha256sum pog-linux-aarch64.tar.gz > pog-linux-aarch64.tar.gz.sha256)
      - name: Build real non-debug ARM64 AWS Nitro Enclave Image File (.eif) & verify non-zero PCR0/PCR1/PCR2
        run: |
          set -euo pipefail
          docker build --no-cache -f infra/images/Dockerfile.anchor --target runtime --build-arg TARGETARCH=arm64 -t pog-anchor-nitro-arm64:release .
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${PWD}/release-assets:/out" \
            public.ecr.aws/amazonlinux/amazonlinux:2023 \
            bash -euo pipefail -c '
              dnf install -y -q aws-nitro-enclaves-cli aws-nitro-enclaves-cli-devel
              export NITRO_CLI_ARTIFACTS=/tmp/nitro-artifacts
              mkdir -p /tmp/nitro-artifacts /var/log/nitro_enclaves
              nitro-cli --version
              nitro-cli build-enclave \
                --docker-uri pog-anchor-nitro-arm64:release \
                --output-file /out/pog-anchor-arm64.eif | tee /out/nitro-arm64-build.log
              (cd /out && sha256sum pog-anchor-arm64.eif > pog-anchor-arm64.eif.sha256)
            '
          python3 - release-assets/nitro-arm64-build.log release-assets/pog-anchor-arm64.eif.measurements.json <<'PY'
          import json, sys
          raw = open(sys.argv[1]).read()
          start = raw.find("{")
          end = raw.rfind("}")
          assert start != -1 and end > start, f"No JSON block found in nitro-cli output:\n{raw}"
          doc = json.loads(raw[start : end + 1])
          open(sys.argv[2], "w").write(json.dumps(doc, indent=2) + "\n")
          print("Extracted ARM64 Nitro EIF measurements:")
          print(json.dumps(doc, indent=2))
          PY
          rm -f release-assets/nitro-arm64-build.log
          python3 scripts/release_gate.py --lint --eif-measurements release-assets/pog-anchor-arm64.eif.measurements.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-aarch64-nitro
          path: release-assets/

  publish-github-release:
    needs: [ build-linux-x86_64, build-linux-aarch64-nitro ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-linux-*
          path: all-assets
          merge-multiple: true
      - name: Publish GitHub Release (x86_64 + aarch64 Static musl & Non-Debug ARM64 AWS Nitro EIF)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la all-assets/
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "${{ github.repository }}" all-assets/* --clobber
          else
            gh release create "$TAG" --repo "${{ github.repository }}" all-assets/* \
              --title "Proof of Geography $TAG" \
              --notes "Static musl Linux x86_64 & aarch64 binaries + non-debug ARM64 AWS Nitro Enclave Image File (.eif) with pinned PCR0/PCR1/PCR2 measurements, multi-region anchor_id vsock support, fresh /attest?nonce= PoP, and pinned vendor silicon roots."
          fi

  promote-production-constellation:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.promote_production == 'true' }}
    needs: [ build-linux-x86_64 ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build real pog-cli cryptographic verifier
        run: cargo build --release --bin pog-cli
      - name: Fail-Closed Production Promotion (Real Verifier + Trust Root + Measured Software + Fresh Key Binding + Separate Coordinate Audit)
        run: |
          python3 scripts/promote_production.py \
            --signed-registry config/signed_public_network.json \
            --web-roster web/data/anchors.json \
            --pinned-root-pk fdff6d6d0b8364e459ffbb921430e39411bd812ec3ce766c2904b39bfa996ee1 \
            --expected-network-id proofofgeography.com \
            --measured-manifest "${{ github.event.inputs.measured_manifest }}" \
            --coordinate-audit "${{ github.event.inputs.coordinate_audit }}" \
            --pog-cli target/release/pog-cli \
            --stage-dir dist/promoted-production
      - name: Upload Authorized Production Promotion Bundle & Receipt
        uses: actions/upload-artifact@v4
        with:
          name: promoted-production-constellation
          path: dist/promoted-production/
