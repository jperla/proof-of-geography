name: Release Linux Static Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binaries for Ubuntu 24.04 x86_64 Confidential VMs
        run: cargo build --release --bin pog-anchor --bin pog-prover --bin pog-cli
      - name: Package release tarball and SHA-256 checksum
        run: |
          mkdir -p dist
          cp target/release/pog-anchor target/release/pog-prover target/release/pog-cli dist/
          tar -czf pog-linux-x86_64.tar.gz -C dist pog-anchor pog-prover pog-cli
          sha256sum pog-linux-x86_64.tar.gz > pog-linux-x86_64.tar.gz.sha256
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" pog-linux-x86_64.tar.gz pog-linux-x86_64.tar.gz.sha256 --clobber
          else
            gh release create "$TAG" pog-linux-x86_64.tar.gz pog-linux-x86_64.tar.gz.sha256 \
              --title "Proof of Geography $TAG" \
              --notes "Reproducible Linux x86_64 (Ubuntu 24.04) binaries for AMD SEV-SNP / Intel TDX / AWS Nitro Confidential VMs."
          fi
