[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pog-verifier"
version = "0.1.0"
description = "Zero-dependency Python offline verifier SDK for Proof of Geography (X-PoG-Proof headers)"
requires-python = ">=3.10"
license = { text = "Apache-2.0 OR MIT" }
dependencies = []

[project.optional-dependencies]
fast = ["cryptography>=42.0"]
