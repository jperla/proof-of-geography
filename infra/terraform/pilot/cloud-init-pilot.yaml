#cloud-config
users:
  - name: pog
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ${ssh_public_key}

write_files:
  - path: /etc/sysctl.d/99-pog-lowlatency.conf
    content: |
      net.core.busy_poll = 50
      net.core.busy_read = 50
      net.core.rmem_max = 16777216
      net.core.wmem_max = 16777216

  - path: /etc/systemd/system/pog-anchor.service
    content: |
      [Unit]
      Description=Proof of Geography Anchor TEE Daemon (${anchor_id})
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      ExecStart=/usr/local/bin/pog-anchor --anchor-id ${anchor_id} --cloud-provider ${cloud_provider} --tcp-listen 0.0.0.0:7443 --udp-bind 0.0.0.0:7444 --http-info-listen 0.0.0.0:7445 --allow-dev-prover
      Restart=always
      RestartSec=2
      CPUSchedulingPolicy=fifo
      CPUSchedulingPriority=50

      [Install]
      WantedBy=multi-user.target

runcmd:
  - sysctl --system
  - curl -fsSL "${release_tarball_url}" -o /tmp/pog-linux-x86_64.tar.gz
  - tar -xzf /tmp/pog-linux-x86_64.tar.gz -C /usr/local/bin/
  - chmod +x /usr/local/bin/pog-anchor /usr/local/bin/pog-prover /usr/local/bin/pog-cli
  - systemctl daemon-reload
  - systemctl enable --now pog-anchor.service
