[workspace]
resolver = "2"
members = [
    "crates/pog-geo",
    "crates/pog-tee",
    "crates/pog-proto",
    "crates/pog-telemetry",
    "crates/pog-log",
    "crates/pog-anchor",
    "crates/pog-prover",
    "crates/pog-cli",
    "crates/pog-llm-demo",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Proof of Geography Contributors"]
repository = "https://github.com/jperla/proof-of-geography"

[workspace.dependencies]
pog-geo = { path = "crates/pog-geo" }
pog-tee = { path = "crates/pog-tee" }
pog-proto = { path = "crates/pog-proto" }
pog-telemetry = { path = "crates/pog-telemetry" }
pog-log = { path = "crates/pog-log" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
blake3 = "1.5"
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
rand = "0.8"
hex = "0.4"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.40", features = ["full"] }
axum = "0.7"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
socket2 = "0.5"
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0"
rustls-pemfile = "2.2"
rcgen = "0.13"
ring = "0.17"
hyper = { version = "1.5", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "server", "service"] }
