anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
axum.workspace = true
x25519-dalek.workspace = true
rand.workspace = true
blake3.workspace = true
hex.workspace = true
chrono.workspace = true
tracing = { workspace = true }
