[package]
name = "pog-tee"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hardware TEE attestation abstraction and cryptographic verification for AMD SEV-SNP, Intel TDX, AWS Nitro Enclaves, and Confidential GPUs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
blake3.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
hex.workspace = true
base64.workspace = true
chrono.workspace = true
libc.workspace = true
ciborium = "0.2"
coset = "0.4"
p384 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
p256 = { version = "0.13", features = ["ecdsa"] }
x509-parser = "0.16"
pem = "3.0"
ring = "0.17"

[target.'cfg(target_os = "linux")'.dependencies]
aws-nitro-enclaves-nsm-api = "0.4"

[dev-dependencies]
rcgen = "0.13"
